    <style>
        /* ===== ОБЩИЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #faf8f6;
            color: #2d2a27;
            line-height: 1.6;
            overflow-x: hidden;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ===== ГЛАВНЫЙ ЭКРАН С ВИДЕО ===== */
        .hero {
            height: 100vh;
            min-height: 700px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            padding: 20px;
            overflow: hidden;
            background: #2d2a27;
        }
        .hero-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        .hero-fallback-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            display: none;
        }
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(20, 30, 40, 0.5) 0%, rgba(0,0,0,0.35) 100%);
            z-index: 1;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(to top, #faf8f6, transparent);
            z-index: 1;
        }
        .hero-badge {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            padding: 8px 28px;
            border-radius: 50px;
            font-size: 0.9rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 20px;
        }
        .hero .names {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 300;
            letter-spacing: 8px;
            text-shadow: 0 2px 30px rgba(0,0,0,0.4);
            margin: 0;
            color: #fff;
        }
        .hero .sub-info {
            margin-top: 25px;
            font-size: 1.1rem;
            opacity: 0.95;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.3);
            display: inline-block;
            padding: 12px 32px;
            border-radius: 50px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
        }
        .hero .sub-info span {
            margin: 0 12px;
        }

        .btn-primary {
            display: inline-block;
            margin-top: 35px;
            padding: 16px 52px;
            background: #fff;
            color: #1a1a1a;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05rem;
            text-decoration: none;
            transition: 0.3s ease;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            letter-spacing: 1px;
        }
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }

        .btn-google {
            display: inline-block;
            margin-top: 10px;
            padding: 16px 52px;
            background: #34a853;
            color: #fff;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05rem;
            text-decoration: none;
            transition: 0.3s ease;
            box-shadow: 0 8px 30px rgba(52, 168, 83, 0.3);
            letter-spacing: 1px;
        }
        .btn-google:hover {
            transform: translateY(-3px) scale(1.02);
            background: #2d9248;
            box-shadow: 0 12px 40px rgba(52, 168, 83, 0.4);
        }

        /* ===== КАРУСЕЛЬ "МЫ" ===== */
        .carousel-container {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
            touch-action: pan-y;
        }
        .carousel-slides {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }
        .carousel-slide {
            min-width: 100%;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #faf8f6;
        }
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #e8e0da;
            user-select: none;
            -webkit-user-drag: none;
        }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
            color: #2d2a27;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel-btn:hover {
            background: #fff;
            transform: translateY(-50%) scale(1.08);
            box-shadow: 0 6px 30px rgba(0,0,0,0.2);
        }
        .carousel-btn:active {
            transform: translateY(-50%) scale(0.95);
        }
        .carousel-btn.prev {
            left: 16px;
        }
        .carousel-btn.next {
            right: 16px;
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .carousel-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #d0c8c3;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            padding: 0;
        }
        .carousel-dot.active {
            background: #8a7a72;
            transform: scale(1.2);
        }
        .carousel-dot:hover {
            background: #b0a49c;
        }

        /* ===== СЕКЦИИ ===== */
        .us-section {
            padding: 80px 0;
            background: #fff;
        }
        .us-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            text-align: center;
            color: #2d2a27;
            margin-bottom: 10px;
            hyphens: auto;
        }
        .us-section .sub {
            text-align: center;
            color: #6b6560;

        }

        .venue-section {

        }
        .venue-section h2 {

            color: #2d2a27;
            margin-bottom: 10px;

            margin-bottom: 40px;

        .venue-single {

            border-radius: 24px;

            box-shadow: 0 12px 40px rgba(0,0,0,0.08);

        .venue-single img {
            width: 100%;

        }

        .info-block {
            padding: 60px 0;

            border-bottom: 1px solid #f0ebe6;
        }
        .info-block:last-of-type {
            border-bottom: none;

            border-left: 4px solid #b8a89e;
        }
        .info-block .content .highlight p:last-child {
            margin-bottom: 0;
        }

        /* ===== КОРГИ - ВКУСНЯШКИ ===== */
        .corgi-treat-section {
            padding: 80px 0 40px;
            background: #fff;
            text-align: center;
        }
        .corgi-treat-section h2 {
            font-family: 'Playfair Display', serif;

        .corgi-treat-section .sub {
            color: #6b6560;

            margin-left: auto;
            margin-right: auto;
        }

        .corgi-treat-wrapper {
            max-width: 550px;
            margin: 0 auto;
            background: #faf8f6;
            border-radius: 32px;
            padding: 30px 30px 35px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.06);
            transition: 0.3s;
            border: 2px solid transparent;
        }
        .corgi-treat-wrapper:hover {
            border-color: #d4c5bc;
        }
        .corgi-treat-wrapper .corgi-image {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            height: 300px;
            margin-bottom: 20px;
        }
        .corgi-treat-wrapper .corgi-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #fff;
            transition: transform 0.3s ease;
        }
        .corgi-treat-wrapper .corgi-image img:hover {
            transform: scale(1.02);
        }

        .corgi-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .corgi-stat {
            background: #fff;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid #f0ebe6;
            transition: 0.3s;
        }
        .corgi-stat:hover {
            border-color: #d4c5bc;
        }
        .corgi-stat .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;

        }
        .corgi-stat .number {
            font-size: 2rem;
            font-weight: 700;
            color: #2d2a27;
            display: block;
        }

        .btn-treat {
            padding: 14px 40px;
            background: #d4a373;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
            box-shadow: 0 6px 20px rgba(212, 163, 115, 0.3);
            letter-spacing: 1px;
            width: 100%;
        }
        .btn-treat:hover {
            background: #c49162;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 163, 115, 0.4);
        }
        .btn-treat:active {
            transform: scale(0.97);
        }

        .treat-message {
            margin-top: 16px;
            font-size: 0.95rem;
            color: #8a7a72;
            min-height: 28px;
            transition: 0.3s;
            font-style: italic;
        }

        /* ===== КОРГИ - ВЫБОР КОСТЮМА ===== */
        .corgi-outfit-section {
            padding: 40px 0 80px;
            background: #fff;
            text-align: center;
        }
        .corgi-outfit-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: #2d2a27;
            margin-bottom: 10px;
        }
        .corgi-outfit-section .sub {
            color: #6b6560;
            margin-bottom: 30px;
            font-size: 1.1rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .corgi-outfit-wrapper {
            max-width: 600px;
            margin: 0 auto;
            background: #faf8f6;
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.06);
            border: 2px solid transparent;
            transition: 0.3s;
        }
        .corgi-outfit-wrapper:hover {
            border-color: #d4c5bc;
        }

        .outfit-carousel-container {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            touch-action: pan-y;
            aspect-ratio: 1 / 1;
        }
        .outfit-carousel-slides {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
            height: 100%;
        }
        .outfit-carousel-slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }
        .outfit-carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #fff;
            user-select: none;
            -webkit-user-drag: none;
            padding: 10px;
        }

        .outfit-carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.3s;
            color: #2d2a27;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .outfit-carousel-btn:hover {
            background: #fff;
            transform: translateY(-50%) scale(1.08);
        }
        .outfit-carousel-btn:active {
            transform: translateY(-50%) scale(0.95);
        }
        .outfit-carousel-btn.prev {
            left: 12px;
        }
        .outfit-carousel-btn.next {
            right: 12px;
        }

        .outfit-carousel-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 16px 0 20px;
            flex-wrap: wrap;
        }
        .outfit-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #d0c8c3;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            padding: 0;
        }
        .outfit-dot.active {

        }
        .outfit-dot:hover {

        }
        .outfit-likes {
            display: flex;

        }
        .outfit-likes .heart-icon {

        }
        .outfit-likes .likes-count {
            font-weight: 700;
            color: #2d2a27;
            font-size: 1.3rem;
            min-width: 30px;
        }

        .btn-like {
            padding: 14px 40px;
            background: #e8c9b0;
            color: #2d2a27;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
            box-shadow: 0 6px 20px rgba(232, 201, 176, 0.3);
            letter-spacing: 1px;

        }
        .btn-like:hover {

        .btn-like:active {

        }
        .btn-like.liked {
            background: #d4a373;
            color: #fff;
        }
        .btn-like.liked:hover {
            background: #c49162;
        }

            background: #fff;

            border: 1px solid #f0ebe6;

        }
        .outfit-top span {

            color: #2d2a27;
        }

            margin-top: 14px;
            font-size: 0.95rem;

            min-height: 28px;

        }

        .timer-section {
            padding: 80px 0;
            text-align: center;
            background: #f3f0ec;
        }
        .timer-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.6rem;
            color: #2d2a27;
        }
        .timer-wrapper {

        }
        .timer {

            margin-top: 35px;
        }
        .timer-item {
            background: #fff;
            padding: 20px 32px;
            border-radius: 24px;

            display: block;
